name: Publish People Assessment Preview to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - feat/people-assessment-centralized
    paths:
      - "public/people-assessment/**"
      - ".github/workflows/people-assessment-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "people-assessment-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/people-assessment
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
