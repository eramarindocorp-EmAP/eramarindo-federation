name: FM-001 Vercel Deployment Check

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  deployment-check:
    name: Validate deployed FM-001 commit
    runs-on: ubuntu-latest
    steps:
      # This action reports the final job result to Vercel on the exact
      # commit that triggered the deployment-ready event.
      - name: Report result to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Deployment"

      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run syntax checks
        run: npm run check

      - name: Run unit tests
        run: npm test
