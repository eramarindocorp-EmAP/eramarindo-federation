name: FM-001 Vercel Deployment Check

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  deployment-check:
    name: Validate deployed FM-001 commit
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.name == 'eramarindo-federation' &&
      github.event.client_payload.git.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The action reports the actual final result of this job to the deployed commit.
      - name: Report result to Vercel
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712
        with:
          name: "FM-001 Production Deployment"

      # Only the deployed main-branch SHA for this project reaches this step.
      - name: Check out the deployed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # FM-001 uses only Node.js built-ins, so no lockfile-based install is needed.
      - name: Run syntax checks
        run: npm run check

      - name: Run unit tests
        run: npm test
